services:
  exporter:
    build:
      context: ..
      dockerfile: monitoring/Dockerfile
    restart: unless-stopped
    # Mount the directory so atomic report replacements are visible immediately.
    volumes:
      - ../:/data:ro

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: gremlin-prometheus2
    restart: unless-stopped
    depends_on:
      - exporter

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

    ports:
      - "9091:9090"

  grafana:
    image: gremlin-grafana:10.3.3
    build:
      context: .
      dockerfile: grafana.Dockerfile
    container_name: gremlin-grafana2
    restart: unless-stopped
    depends_on:
      - prometheus

    ports:
      - "3001:3000"

    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_DEFAULT_THEME=dark

    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning
      - ./assets/gremlin-header.svg:/usr/share/grafana/public/img/gremlin-header.svg:ro

volumes:
  prometheus-data:
  grafana-data:
