services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: gremlin-prometheus2
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:10.3.3
    container_name: gremlin-grafana2
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
