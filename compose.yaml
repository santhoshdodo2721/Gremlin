    extends:
      file: aut/microservices-demo/deploy/docker-compose/docker-compose.yml
      service: catalogue-db
  edge-router:
    <<: *application
    extends:
      file: aut/microservices-demo/deploy/docker-compose/docker-compose.yml
      service: edge-router
  front-end:
    <<: *application
    extends:
      file: aut/microservices-demo/deploy/docker-compose/docker-compose.yml
      service: front-end
  orders:
    <<: *application
    extends:
      file: aut/microservices-demo/deploy/docker-compose/docker-compose.yml
