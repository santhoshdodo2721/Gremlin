  shipping:
    <<: *application
    extends:
      file: aut/microservices-demo/deploy/docker-compose/docker-compose.yml
      service: shipping
  user:
    <<: *application
    extends:
      file: aut/microservices-demo/deploy/docker-compose/docker-compose.yml
      service: user
  user-db:
    <<: *application
    extends:
