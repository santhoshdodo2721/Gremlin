name: Chaos CI

on:
  push:
    branches: [ main, tosh ]
  pull_request:
    branches: [ main, tosh ]
  workflow_dispatch: {}

jobs:
  chaos-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Test and vet CLI
        run: |
          go test -race ./...
          go vet ./...

      - name: Build ResilenceOps
        run: go build -o resiletops ./cmd/gremlin

      - name: Build network fault helper
        run: |
          docker build -t gremlin-helper:latest -f tools/netem.Dockerfile .
          docker run --rm gremlin-helper:latest tc -V

      - name: Start the Application Under Test
        run: |
          git clone https://github.com/microservices-demo/microservices-demo.git aut/microservices-demo
          cd aut/microservices-demo/deploy/docker-compose
          docker compose -f docker-compose.yml up -d
          echo "Waiting for AUT to become healthy..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost/ > /dev/null; then
              echo "AUT is healthy"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost/

      - name: Run chaos attack - container-kill
        run: ./resiletops attack --name container-kill --target docker-compose-front-end-1 --health-url http://localhost/

      - name: Run chaos attack - latency
        run: ./resiletops attack --name latency --target docker-compose-front-end-1 --health-url http://localhost/ --delay-ms 200 --jitter-ms 20 --duration-s 10

      - name: Run chaos attack - cpu
        run: ./resiletops attack --name cpu --target docker-compose-front-end-1 --health-url http://localhost/ --workers 2 --duration-s 10

      - name: Run resilience threshold test
        run: |
          ./resiletops threshold --attack latency --target docker-compose-front-end-1 --health-url http://localhost/ --commit ${{ github.sha }}
          ./resiletops threshold-check --tolerance-pct 20

      - name: Show report
        run: ./resiletops report

      - name: Upload chaos report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gremlin-reports
          path: gremlin-reports.json

      - name: Commit resilience history
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resilience-history.json
          git diff --staged --quiet || git commit -m "Update resilience history [skip ci]"
          git push

      - name: Application diagnostics
        if: failure()
        run: |
          if [ -f aut/microservices-demo/deploy/docker-compose/docker-compose.yml ]; then
            cd aut/microservices-demo/deploy/docker-compose
            docker compose -f docker-compose.yml ps -a
            docker compose -f docker-compose.yml logs --tail=100
          fi

      - name: Tear down AUT
        if: always()
        run: |
          if [ -f aut/microservices-demo/deploy/docker-compose/docker-compose.yml ]; then
            cd aut/microservices-demo/deploy/docker-compose
            docker compose -f docker-compose.yml down -v
          fi
